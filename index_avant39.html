<html lang="fr">
<head>

<meta name="theme-color" content="#062E1A">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="icone-192.png?v=480f4d8b">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=480f4d8b">

<style>
  :root{--forest:#062E1A;--vif:#12B347;--encre:#06210F;--clair:#EAFBF0}
  html,body{margin:0;height:100%;background:var(--forest);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;overflow:hidden}
  #app{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);background:#F2FAF4}
  #app iframe{width:100%;height:100%;border:0;display:block;background:#F2FAF4}
  #splash{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(600px 400px at 50% 40%,rgba(18,179,71,.35),transparent 70%),var(--forest);transition:opacity .6s ease}
  #splash img{width:96px;height:96px;border-radius:24px;box-shadow:0 0 0 4px rgba(18,179,71,.35),0 20px 50px rgba(0,0,0,.4);animation:entre .8s cubic-bezier(.2,.8,.2,1) both}
  #splash b{font-size:26px;letter-spacing:-.02em;animation:entre .8s .12s cubic-bezier(.2,.8,.2,1) both}
  #splash span{font-size:14px;color:#B5D9C1;animation:entre .8s .24s cubic-bezier(.2,.8,.2,1) both}
  #splash i{width:140px;height:4px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;position:relative}
  #splash i::after{content:"";position:absolute;inset:0;width:40%;background:var(--vif);border-radius:4px;animation:charge 1.1s ease-in-out infinite}
  @keyframes entre{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes charge{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
  #bandeau{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:none;align-items:center;gap:12px;background:var(--forest);color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 18px 40px rgba(0,0,0,.35);font-size:14px;line-height:1.4}
  #bandeau.vu{display:flex;animation:entre .5s ease both}
  #bandeau img{width:40px;height:40px;border-radius:10px;flex:none}
  #bandeau .t{flex:1;min-width:0}
  #bandeau button{border:0;border-radius:12px;font-weight:800;font-size:14px;font-family:inherit;padding:11px 14px;cursor:pointer;min-height:44px}
  #installer{background:var(--vif);color:var(--encre)}
  #plusTard{background:transparent;color:#B5D9C1}
  #horsLigne{position:fixed;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:var(--forest)}
  #horsLigne.vu{display:flex}
  #horsLigne button{border:0;border-radius:12px;background:var(--vif);color:var(--encre);font-weight:800;font-size:15px;font-family:inherit;padding:13px 20px;min-height:44px;cursor:pointer}
  #pBtn{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;width:48px;height:48px;border-radius:50%;border:0;background:var(--forest);box-shadow:0 10px 26px rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;cursor:pointer;padding:0}
  #pBtn.vu{display:flex}
  #clBtn{position:fixed;left:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:4;width:48px;height:48px;border-radius:50%;border:0;background:var(--vif);box-shadow:0 10px 26px rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;cursor:pointer;padding:0}
  #clBtn.vu{display:flex}
  #clBtn svg{width:23px;height:23px}
  #toastP{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--encre);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.4);opacity:0;transition:opacity .3s;pointer-events:none;max-width:88%;text-align:center}
  #toastP.vu{opacity:1}
  #pBtn svg{width:22px;height:22px}
  #partage{position:fixed;inset:0;z-index:8;display:none;align-items:flex-end;justify-content:center;background:rgba(3,20,11,.55)}
  #partage.vu{display:flex}
  #partage .f{width:100%;max-width:520px;background:#fff;color:var(--encre);border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));box-sizing:border-box;animation:entre .35s ease both}
  #partage h2{margin:0 0 4px;font-size:20px}
  #partage p{margin:0 0 14px;color:#4F6156;font-size:14px;line-height:1.45}
  #partage .g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  #partage .g button,#partage .g a{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;border:1.5px solid #DCE8DF;background:#fff;color:var(--encre);font:800 15px Manrope,system-ui,sans-serif;text-decoration:none;cursor:pointer}
  #partage .g .pp{grid-column:1/-1;background:var(--vif);border-color:var(--vif);color:var(--encre)}
  #partage .lien{margin-top:12px;font-size:13px;color:#4F6156;word-break:break-all;text-align:center}
  #partage .fermer{display:block;width:100%;margin-top:10px;min-height:46px;border:0;background:transparent;color:#4F6156;font:700 15px Manrope,system-ui,sans-serif;cursor:pointer}
  #cloche{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:6;width:46px;height:46px;border-radius:50%;border:0;background:var(--forest);box-shadow:0 10px 26px rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;cursor:pointer;padding:0}
  #cloche.vu{display:flex}
  #cloche svg{width:22px;height:22px}
  #pastille{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;border-radius:10px;background:#E4483B;color:#fff;font:800 12px/20px Manrope,system-ui,sans-serif;text-align:center;padding:0 5px;box-sizing:border-box;display:none}
  #pastille.vu{display:block}
  #centre{position:fixed;inset:0;z-index:9;display:none;align-items:flex-start;justify-content:center;background:rgba(3,20,11,.55)}
  #centre.vu{display:flex}
  #centre .f{width:100%;max-width:520px;max-height:82vh;overflow:auto;margin-top:calc(8px + env(safe-area-inset-top,0px));background:#fff;color:var(--encre);border-radius:0 0 22px 22px;padding:18px 16px calc(14px + env(safe-area-inset-bottom,0px));box-sizing:border-box;animation:descend .3s ease both}
  @keyframes descend{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
  #centre h2{margin:0 0 12px;font-size:19px;display:flex;align-items:center;gap:8px}
  #centre .vide{color:#4F6156;font-size:14px;padding:16px 4px}
  .notif{border:1.5px solid #E1ECE4;border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .notif.neuf{border-color:var(--vif);background:#F2FBF5}
  .notif .h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .notif .et{font:800 11px Manrope,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:999px}
  .notif .et.maj{background:var(--vif);color:var(--encre)}
  .notif .et.nouveaute{background:#E6F0FF;color:#1D4ED8}
  .notif b{font-size:15px}
  .notif .d{color:#8A9A90;font-size:12px;margin-left:auto}
  .notif p{margin:4px 0 0;font-size:14px;line-height:1.5;color:#3B4B41}
  .notif .maj-btn{margin-top:10px;border:0;border-radius:11px;background:var(--vif);color:var(--encre);font:800 14px Manrope,system-ui,sans-serif;padding:11px 16px;min-height:44px;cursor:pointer}
  #centre .fermer{display:block;width:100%;margin-top:4px;min-height:46px;border:0;background:transparent;color:#4F6156;font:700 15px Manrope,system-ui,sans-serif;cursor:pointer}
  #bulle{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:7;display:none;gap:12px;align-items:flex-start;background:var(--forest);color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 18px 40px rgba(0,0,0,.4)}
  #bulle.vu{display:flex;animation:descend .4s ease both}
  #bulle svg{width:26px;height:26px;flex:none;margin-top:2px}
  #bulle .t{flex:1;min-width:0;font-size:14px;line-height:1.4}
  #bulle .t b{display:block;margin-bottom:2px}
  #bulle .actions{display:flex;flex-direction:column;gap:6px}
  #bulle .pm{border:0;border-radius:11px;background:var(--vif);color:var(--encre);font:800 13px Manrope,system-ui,sans-serif;padding:9px 12px;min-height:40px;cursor:pointer;white-space:nowrap}
  #bulle .x{border:0;background:transparent;color:#B5D9C1;font-size:18px;cursor:pointer;padding:2px 6px}
  @media (prefers-reduced-motion: reduce){#splash *,#bandeau.vu{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<button type="button" id="cloche" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span id="pastille"></span></button>
<div id="bulle" role="alert"><svg viewBox="0 0 24 24" fill="none" stroke="#12B347" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><div class="t" id="bulleTexte"></div><div class="actions"><button type="button" class="pm" id="bulleBtn"></button><button type="button" class="x" id="bulleX" aria-label="Fermer">✕</button></div></div>
<div id="centre" role="dialog" aria-modal="true" aria-labelledby="cT"><div class="f"><h2 id="cT"></h2><div id="cListe"></div><button type="button" class="fermer" id="cFermer"></button></div></div>

<div id="splash" role="status" aria-live="polite"><img src="icone-192.png?v=480f4d8b" alt=""><b>AssistAcad</b><span>Votre réussite, notre priorité</span><i></i></div>
<div id="bandeau" role="region" aria-label="Installer l’application">
  <img src="icone-192.png?v=480f4d8b" alt="">
  <div class="t" id="bandeauTexte"><b>Installer AssistAcad</b><br>Votre espace sur l’écran d’accueil.</div>
  <button type="button" id="installer">Installer</button>
  <button type="button" id="plusTard" aria-label="Plus tard">✕</button>
</div>
<div id="horsLigne" role="alert"><b style="font-size:22px">Pas de connexion Internet</b><span style="color:#B5D9C1">Vérifiez le Wi-Fi ou les données mobiles, puis réessayez.</span><button type="button" onclick="location.reload()">Réessayer</button></div>
<button type="button" id="pBtn" aria-label="Partager l’application"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M8.6 10.6 15.4 6.9M8.6 13.4l6.8 3.7"/><circle cx="6" cy="12" r="2.6" fill="#fff"/><circle cx="18" cy="5.5" r="2.6" fill="#fff"/><circle cx="18" cy="18.5" r="2.6" fill="#fff"/></svg></button>
<button type="button" id="clBtn" aria-label="Activer les notifications"><svg viewBox="0 0 24 24" fill="#06210F" aria-hidden="true"><path d="M12 2a6 6 0 0 0-6 6c0 3.5-1 5-2 6.2-.5.6-.1 1.6.7 1.6h14.6c.8 0 1.2-1 .7-1.6C19 13 18 11.5 18 8a6 6 0 0 0-6-6Z"/><path d="M9.5 20a2.5 2.5 0 0 0 5 0Z"/></svg></button>
<div id="toastP" role="status" aria-live="polite"></div>
<div id="partage" role="dialog" aria-modal="true" aria-labelledby="pT"><div class="f">
  <h2 id="pT"></h2><p id="pS"></p>
  <div class="g">
    <button type="button" class="pp" id="pNatif"></button>
    <a id="pWa" target="_blank" rel="noopener">WhatsApp</a>
    <a id="pTg" target="_blank" rel="noopener">Telegram</a>
    <button type="button" id="pCopie" style="grid-column:1/-1"></button>
  </div>
  <div class="lien" id="pLien"></div>
  <button type="button" class="fermer" id="pFermer"></button>
</div></div>
<script>
(function () {
  "use strict";
  var MAJ_ACTUELLE = "480f4d8b";  // version installée ; changée à chaque déploiement
  var splash = document.getElementById("splash"), app = document.getElementById("app");
  var enAppli = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  function finSplash() { splash.style.opacity = "0"; setTimeout(function () { splash.style.display = "none"; }, 650); }
  function horsLigne() { document.getElementById("horsLigne").classList.add("vu"); finSplash(); }
  if (!navigator.onLine) { horsLigne(); }
  fetch("config.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (c) {
    if (!c || !/^https:\/\/script\.google\.com\/.+\/exec$/.test(String(c.url || ""))) { splash.querySelector("span").textContent = "Configuration incomplète : le lien n’est pas encore renseigné."; return; }
    window.__CFG = c; try { demarrerPush(c); } catch (e) {}
    var f = document.createElement("iframe");
    f.title = "AssistAcad"; f.allow = "clipboard-write; fullscreen";
    f.src = c.url + "?cadre=1&app=1";
    f.addEventListener("load", function () { setTimeout(finSplash, 400); });
    app.appendChild(f);
    setTimeout(finSplash, 9000);
  }).catch(horsLigne);
  window.addEventListener("offline", horsLigne);

  // Installation : Android et ordinateur (Chrome, Edge) proposent le bouton ; iPhone : explication
  var invite = null, bandeau = document.getElementById("bandeau"), refus = false;
  try { refus = localStorage.getItem("aa_install_non") === "1"; } catch (e) {}
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); invite = e; if (!refus && !enAppli) bandeau.classList.add("vu"); });
  document.getElementById("installer").onclick = function () {
    if (invite) { invite.prompt(); invite.userChoice.then(function () { bandeau.classList.remove("vu"); invite = null; }); return; }
    bandeau.classList.remove("vu");
  };
  document.getElementById("plusTard").onclick = function () { bandeau.classList.remove("vu"); try { localStorage.setItem("aa_install_non", "1"); } catch (e) {} };
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
  if (ios && !enAppli && !refus) {
    document.getElementById("bandeauTexte").innerHTML = "<b>Installer AssistAcad</b><br>Touchez <b>Partager</b> ⬆️ puis <b>« Sur l’écran d’accueil »</b>.";
    document.getElementById("installer").textContent = "Compris";
    setTimeout(function () { bandeau.classList.add("vu"); }, 2500);
  }

  // Partager l'application : raccourci « Partager » (appui long sur l'icône, Android)
  // et bouton rond en bas à gauche dans l'application installée (Android et iPhone)
  var LG = (navigator.language || "fr").slice(0, 2).toLowerCase();
  var TX = {
    fr: ["Partager AssistAcad", "Envoyez l’application à un ami : il l’installe en un geste depuis ce lien.", "Partager…", "Copier le lien", "Lien copié ✓", "Fermer", "AssistAcad — aide académique (mémoires, thèses, présentations). Installe l’application : ", "Activer les notifications", "Notifications activées ✓", "Notifications refusées — autorisez-les dans les réglages du téléphone."],
    en: ["Share AssistAcad", "Send the app to a friend: they can install it from this link in one tap.", "Share…", "Copy link", "Link copied ✓", "Close", "AssistAcad — academic help (theses, dissertations, presentations). Install the app: ", "Turn on notifications", "Notifications on ✓", "Notifications blocked — allow them in your phone settings."],
    ru: ["Поделиться AssistAcad", "Отправьте приложение другу: он установит его по этой ссылке.", "Поделиться…", "Скопировать ссылку", "Ссылка скопирована ✓", "Закрыть", "AssistAcad — помощь в учёбе (дипломы, курсовые, презентации). Установите приложение: ", "Включить уведомления", "Уведомления включены ✓", "Уведомления запрещены — разрешите их в настройках телефона."],
    ar: ["مشاركة AssistAcad", "أرسل التطبيق إلى صديق ليثبّته من هذا الرابط.", "مشاركة…", "نسخ الرابط", "تم نسخ الرابط ✓", "إغلاق", "AssistAcad — مساعدة أكاديمية (مذكرات، أطروحات، عروض). ثبّت التطبيق: ", "تفعيل الإشعارات", "تم تفعيل الإشعارات ✓", "الإشعارات محظورة — فعّلها من إعدادات الهاتف."]
  };
  var tx = TX[LG] || TX.fr, pg = document.getElementById("partage");
  var LIEN = location.origin + location.pathname.replace(/index\.html$/, "");
  var MSG = tx[6] + LIEN;
  if (LG === "ar") pg.setAttribute("dir", "rtl");
  document.getElementById("pT").textContent = tx[0]; document.getElementById("pS").textContent = tx[1];
  document.getElementById("pNatif").textContent = tx[2]; document.getElementById("pCopie").textContent = tx[3];
  document.getElementById("pFermer").textContent = tx[5]; document.getElementById("pLien").textContent = LIEN;
  document.getElementById("pWa").href = "https://wa.me/?text=" + encodeURIComponent(MSG);
  document.getElementById("pTg").href = "https://t.me/share/url?url=" + encodeURIComponent(LIEN) + "&text=" + encodeURIComponent(tx[6].replace(/[:：]\s*$/, ""));
  if (!navigator.share) document.getElementById("pNatif").style.display = "none";
  function ouvrirPartage() { pg.classList.add("vu"); }
  function fermerPartage() { pg.classList.remove("vu"); }
  document.getElementById("pNatif").onclick = function () {
    navigator.share({ title: "AssistAcad", text: tx[6], url: LIEN }).then(fermerPartage).catch(function () {});
  };
  document.getElementById("pCopie").onclick = function () {
    var b = this, ok = function () { b.textContent = tx[4]; setTimeout(function () { b.textContent = tx[3]; }, 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(LIEN).then(ok, function () { prompt(tx[3], LIEN); });
    else { var t = document.createElement("textarea"); t.value = LIEN; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); ok(); } catch (e) {} t.remove(); }
  };
  document.getElementById("pFermer").onclick = fermerPartage;
  pg.addEventListener("click", function (e) { if (e.target === pg) fermerPartage(); });
  document.getElementById("pBtn").onclick = ouvrirPartage;
  document.getElementById("pBtn").setAttribute("aria-label", tx[0]);
  if (enAppli) document.getElementById("pBtn").classList.add("vu");
  if (/[?&]partager=1/.test(location.search)) {
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
    setTimeout(function () { finSplash(); ouvrirPartage(); }, 600);
  }

  // ====== Notifications : nouveautés et mises à jour (fichier nouveautes.json sur GitHub) ======
  var NT = {
    fr: { titre: "Notifications", vide: "Aucune notification pour l’instant.", fermer: "Fermer", maj: "Mise à jour", nouv: "Nouveauté", majBtn: "Mettre à jour", plus: "Voir" },
    en: { titre: "Notifications", vide: "No notifications yet.", fermer: "Close", maj: "Update", nouv: "News", majBtn: "Update", plus: "View" },
    ru: { titre: "Уведомления", vide: "Пока нет уведомлений.", fermer: "Закрыть", maj: "Обновление", nouv: "Новое", majBtn: "Обновить", plus: "Открыть" },
    ar: { titre: "الإشعارات", vide: "لا توجد إشعارات بعد.", fermer: "إغلاق", maj: "تحديث", nouv: "جديد", majBtn: "تحديث", plus: "عرض" }
  };
  var nt = NT[LG] || NT.fr, cloche = document.getElementById("cloche"), pastille = document.getElementById("pastille"),
      centre = document.getElementById("centre"), bulle = document.getElementById("bulle");
  document.getElementById("cT").textContent = nt.titre;
  document.getElementById("cFermer").textContent = nt.fermer;
  if (LG === "ar") { centre.setAttribute("dir", "rtl"); bulle.setAttribute("dir", "rtl"); }
  function luSet() { try { return JSON.parse(localStorage.getItem("aa_notif_lu") || "[]"); } catch (e) { return []; } }
  function luAdd(ids) { try { var v = luSet(); ids.forEach(function (i) { if (v.indexOf(i) < 0) v.push(i); }); localStorage.setItem("aa_notif_lu", JSON.stringify(v.slice(-80))); } catch (e) {} }
  function tr(o) { return o ? (o[LG] || o.fr || o.en || "") : ""; }
  function majMaintenant() {
    if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistration) {
      navigator.serviceWorker.getRegistration().then(function (r) { if (r && r.waiting) r.waiting.postMessage("maj"); });
    }
    if (window.caches && caches.keys) { caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }).then(function () { location.reload(true); }); }
    else location.reload(true);
  }
  var FEED = [];
  function dessiner() {
    var lu = luSet(), liste = document.getElementById("cListe"); liste.innerHTML = "";
    if (!FEED.length) { liste.innerHTML = '<div class="vide">' + nt.vide + '</div>'; return; }
    FEED.forEach(function (it) {
      var neuf = lu.indexOf(it.id) < 0, maj = it.type === "maj";
      var d = document.createElement("div"); d.className = "notif" + (neuf ? " neuf" : "");
      var et = '<span class="et ' + (maj ? "maj" : "nouveaute") + '">' + (maj ? nt.maj : nt.nouv) + '</span>';
      d.innerHTML = '<div class="h">' + et + '<b>' + esc(tr(it.titre)) + '</b><span class="d">' + esc(it.date || "") + '</span></div><p>' + esc(tr(it.texte)) + '</p>';
      if (maj) { var b = document.createElement("button"); b.className = "maj-btn"; b.textContent = nt.majBtn; b.onclick = majMaintenant; d.appendChild(b); }
      else if (it.lien) { var a = document.createElement("a"); a.href = it.lien; a.target = "_blank"; a.rel = "noopener"; a.className = "maj-btn"; a.style.display = "inline-block"; a.style.textDecoration = "none"; a.textContent = nt.plus; d.appendChild(a); }
      liste.appendChild(d);
    });
  }
  function esc(x) { return String(x == null ? "" : x).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function badge() {
    var lu = luSet(), n = FEED.filter(function (it) { return lu.indexOf(it.id) < 0; }).length;
    if (n > 0) { pastille.textContent = n > 9 ? "9+" : String(n); pastille.classList.add("vu"); } else pastille.classList.remove("vu");
    return n;
  }
  function montrerBulle() {
    var lu = luSet(), neuf = FEED.filter(function (it) { return lu.indexOf(it.id) < 0; })[0];
    if (!neuf) return;
    var maj = neuf.type === "maj";
    document.getElementById("bulleTexte").innerHTML = "<b>" + esc(tr(neuf.titre)) + "</b>" + esc(tr(neuf.texte));
    var b = document.getElementById("bulleBtn");
    b.textContent = maj ? nt.majBtn : nt.plus;
    b.onclick = function () { bulle.classList.remove("vu"); if (maj) majMaintenant(); else ouvrirCentre(); };
    bulle.classList.add("vu");
    setTimeout(function () { bulle.classList.remove("vu"); }, 9000);
    // Notification du téléphone (si l'application est ouverte et l'autorisation donnée)
    try { if (window.Notification && Notification.permission === "granted") new Notification(tr(neuf.titre), { body: tr(neuf.texte), icon: "icone-192.png?v=480f4d8b", tag: neuf.id }); } catch (e) {}
  }
  function ouvrirCentre() { dessiner(); centre.classList.add("vu"); luAdd(FEED.map(function (it) { return it.id; })); badge(); }
  cloche.onclick = ouvrirCentre;
  document.getElementById("cFermer").onclick = function () { centre.classList.remove("vu"); };
  centre.addEventListener("click", function (e) { if (e.target === centre) centre.classList.remove("vu"); });
  document.getElementById("bulleX").onclick = function () { bulle.classList.remove("vu"); };
  function charger() {
    fetch("nouveautes.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
      // une mise à jour ne s'affiche que si elle vise une version différente de celle déjà installée
      FEED = (j && j.items || []).filter(function (it) {
        if (!it || !it.id) return false;
        if (it.type === "maj") return String(it.cible || "") !== MAJ_ACTUELLE;
        return true;
      });
      if (enAppli) cloche.classList.add("vu");
      var n = badge();
      if (n > 0) { if (window.Notification && Notification.permission === "default" && enAppli) setTimeout(function () { try { Notification.requestPermission(); } catch (e) {} }, 4000); setTimeout(montrerBulle, 1800); }
    }).catch(function () {});
  }
  charger();
  document.addEventListener("visibilitychange", function () { if (!document.hidden) charger(); });

  // ---- Notifications push (bulle sur l'écran, même application fermée) ----
  function urlB64(b64) {
    var pad = "=".repeat((4 - b64.length % 4) % 4);
    var base = (b64 + pad).replace(/-/g, "+").replace(/_/g, "/");
    var raw = atob(base), u = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) u[i] = raw.charCodeAt(i);
    return u;
  }
  function toastP(msg) {
    var t = document.getElementById("toastP"); t.textContent = msg; t.classList.add("vu");
    setTimeout(function () { t.classList.remove("vu"); }, 3200);
  }
  function majCloche() {
    var b = document.getElementById("clBtn"), peut = ("serviceWorker" in navigator) && ("PushManager" in window) && window.__CFG && window.__CFG.push_cle;
    var ok = (window.Notification && Notification.permission === "granted");
    if (enAppli && peut && !ok && Notification.permission !== "denied") b.classList.add("vu"); else b.classList.remove("vu");
  }
  function pushAbonner(cfg, forcer) {
    if (!("serviceWorker" in navigator) || !("PushManager" in window) || !cfg || !cfg.push_cle || !window.Notification) return;
    if (Notification.permission === "denied") { if (forcer) toastP((TX[LG] || TX.fr)[9]); return; }
    if (!forcer && Notification.permission !== "granted") return;
    navigator.serviceWorker.ready.then(function (reg) {
      return reg.pushManager.getSubscription().then(function (sub) {
        if (sub) return sub;
        return Notification.requestPermission().then(function (perm) {
          if (perm !== "granted") throw new Error("refus");
          return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(cfg.push_cle) });
        });
      });
    }).then(function (sub) {
      var lg = (navigator.language || "fr").slice(0, 2);
      fetch(cfg.url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body: JSON.stringify({ push: "abonner", sub: sub.toJSON(), langue: lg }) }).catch(function () {});
      try { localStorage.setItem("aa_push", "1"); } catch (e) {}
      majCloche(); if (forcer) toastP((TX[LG] || TX.fr)[8]);
    }).catch(function () { if (forcer) toastP((TX[LG] || TX.fr)[9]); majCloche(); });
  }
  function demarrerPush(cfg) {
    document.getElementById("clBtn").setAttribute("aria-label", (TX[LG] || TX.fr)[7]);
    document.getElementById("clBtn").onclick = function () { pushAbonner(cfg, true); };
    majCloche();
    if (window.Notification && Notification.permission === "granted") pushAbonner(cfg, false); // réabonne en silence
  }

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
