# Construit l'application AssistAcad Client pour ordinateur (Windows, macOS, Linux).
# Onglet « Actions » › « Construire AssistAcad Client » › « Run workflow ».
# Le lien de l'espace client est pris dans config.json (à la racine du dépôt).
name: Construire AssistAcad Client
on:
  workflow_dispatch:
  push:
    tags: ["client-v*"]
permissions:
  contents: write
jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bureau
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bureau/package-lock.json
      - name: Lien de l'espace client
        shell: bash
        run: cp ../config.json config.json && cat config.json
      - run: npm ci
      - name: Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
      - name: macOS
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Linux
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AssistAcad-Client-${{ runner.os }}
          path: |
            bureau/dist/*.exe
            bureau/dist/*.dmg
            bureau/dist/*.AppImage
            bureau/dist/*.deb
          if-no-files-found: error
      - name: Joindre à la Release
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bureau/dist/*.exe
            bureau/dist/*.dmg
            bureau/dist/*.AppImage
            bureau/dist/*.deb
